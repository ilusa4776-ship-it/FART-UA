<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FART UA | GTA RP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#090909;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1920&q=80");
background-size:cover;
background-position:center;
z-index:-2;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:34px;
font-weight:800;
color:#ff1e1e;
text-shadow:0 0 20px red;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav a{
color:white;
text-decoration:none;
transition:.3s;
}

nav a:hover{
color:#ff2b2b;
}

header{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

header h1{
font-size:95px;
color:#ff2222;
text-shadow:0 0 35px red;
animation:pulse 2s infinite;
}

header p{
font-size:24px;
margin-top:20px;
color:#ddd;
max-width:700px;
}

.buttons{
margin-top:40px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.btn{
padding:18px 42px;
border-radius:10px;
background:#c00000;
color:white;
text-decoration:none;
font-size:18px;
transition:.3s;
box-shadow:0 0 25px rgba(255,0,0,.6);
}

.btn:hover{
background:#ff0000;
transform:translateY(-6px);
box-shadow:0 0 35px red;
}

section{
max-width:1200px;
margin:auto;
padding:100px 20px;
}

.title{
font-size:45px;
text-align:center;
margin-bottom:60px;
color:#ff2a2a;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:rgba(20,20,20,.85);
padding:30px;
border-radius:15px;
border:1px solid rgba(255,0,0,.3);
transition:.4s;
}

.card:hover{
transform:translateY(-12px);
box-shadow:0 0 25px red;
}

.card h3{
margin-bottom:15px;
color:#ff2f2f;
}

.card p{
color:#ccc;
line-height:1.7;
}
/* ===== СЕКЦІЯ ПРО СЕРВЕР ===== */

.about{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:40px;
align-items:center;
}

.about-box{
background:rgba(15,15,15,.9);
padding:35px;
border-radius:20px;
border-left:5px solid #ff2020;
box-shadow:0 0 20px rgba(255,0,0,.25);
}

.about-box h2{
font-size:32px;
color:#ff3030;
margin-bottom:20px;
}

.about-box p{
font-size:17px;
color:#ccc;
line-height:1.8;
}


/* ===== СТАТИСТИКА ===== */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:25px;
text-align:center;
}

.stat{
background:#111;
padding:35px;
border-radius:15px;
border:1px solid rgba(255,0,0,.4);
}

.stat h2{
font-size:45px;
color:#ff2222;
text-shadow:0 0 15px red;
}

.stat p{
margin-top:10px;
color:#bbb;
}


/* ===== ФРАКЦІЇ ===== */

.factions{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.faction{
background:linear-gradient(145deg,#151515,#090909);
padding:30px;
border-radius:15px;
text-align:center;
transition:.3s;
}

.faction:hover{
transform:scale(1.05);
box-shadow:0 0 30px rgba(255,0,0,.7);
}

.faction span{
font-size:50px;
}

.faction h3{
margin:15px 0;
color:#ff2929;
}

.faction p{
color:#ccc;
}


/* ===== ГАЛЕРЕЯ ===== */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
transition:.4s;
filter:brightness(.8);
}

.gallery img:hover{
transform:scale(1.05);
filter:brightness(1);
box-shadow:0 0 25px red;
}


/* ===== АДАПТИВ ===== */

@media(max-width:900px){

nav{
padding:20px;
}

.logo{
font-size:26px;
}

nav ul{
display:none;
}

header h1{
font-size:55px;
}

header p{
font-size:18px;
}

.title{
font-size:35px;
}

}
/* ===== ДОНАТ ===== */

.donate{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.donate-card{
background:rgba(20,20,20,.9);
padding:35px;
border-radius:20px;
text-align:center;
border:1px solid #ff2020;
transition:.4s;
}

.donate-card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px red;
}

.donate-card h3{
font-size:28px;
color:#ff2525;
}

.price{
font-size:40px;
font-weight:800;
margin:20px 0;
color:white;
}

.donate-card ul{
list-style:none;
color:#ccc;
line-height:2;
}

.donate-btn{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:#d00000;
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.donate-btn:hover{
background:red;
}


/* ===== ПРАВИЛА ===== */

.rules{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.rule{
background:#111;
padding:30px;
border-radius:15px;
border-top:4px solid red;
}

.rule h3{
color:#ff3030;
margin-bottom:15px;
}

.rule p{
color:#bbb;
line-height:1.7;
}


/* ===== КОМАНДА ===== */

.team{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
}

.member{
background:#151515;
padding:25px;
text-align:center;
border-radius:20px;
transition:.3s;
}

.member:hover{
box-shadow:0 0 30px red;
transform:translateY(-8px);
}

.member img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid red;
}

.member h3{
margin-top:15px;
color:#ff2525;
}

.member p{
color:#aaa;
}


/* ===== DISCORD ===== */

.discord{
background:
linear-gradient(
135deg,
rgba(255,0,0,.2),
rgba(0,0,0,.8)
),
#111;

padding:60px 30px;
border-radius:25px;
text-align:center;
border:1px solid red;
}

.discord h2{
font-size:45px;
color:white;
}

.discord p{
margin:20px auto;
max-width:700px;
color:#ccc;
font-size:18px;
}

.discord a{
display:inline-block;
padding:18px 45px;
background:#5865F2;
color:white;
border-radius:12px;
text-decoration:none;
font-size:20px;
transition:.3s;
}

.discord a:hover{
transform:scale(1.08);
box-shadow:0 0 25px #5865F2;
}


/* ===== FAQ ===== */

.faq{
max-width:900px;
margin:auto;
}

.question{
background:#151515;
margin-bottom:15px;
padding:25px;
border-radius:12px;
border-left:4px solid red;
}

.question h3{
color:#ff3030;
margin-bottom:10px;
}

.question p{
color:#bbb;
}


/* ===== ПЛАВАЮЧА КНОПКА ===== */

.top{
position:fixed;
right:30px;
bottom:30px;
width:55px;
height:55px;
background:red;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:25px;
text-decoration:none;
box-shadow:0 0 20px red;
transition:.3s;
}

.top:hover{
transform:translateY(-5px);
}
